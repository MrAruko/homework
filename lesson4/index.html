<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/style.css" />
		<title>Document</title>
	</head>
	<body>
		<form class="forma1">
			<h3>Ваши личные данные</h3>
			<label>
				Ваше имя
				<input
					class="input"
					type="text"
					placeholder="Имя"
					name="name"
					required
				/>
			</label>
			<label>
				Ваш возраст
				<input
					class="input"
					type="number"
					placeholder="Возраст"
					name="vozrast"
					required
				/>
			</label>
			<label>
				Ваши номер телефона
				<input
					class="input"
					type="tel"
					placeholder="Номер телефона"
					name="tel"
					required
				/>
			</label>
			<label>
				Ваша почта
				<input
					class="input"
					type="email"
					placeholder="Почта"
					name="email"
					required
				/>
			</label>
			<label>
				Сообщение
				<textarea placeholder="Ваше сообщение" name="email" required></textarea>
			</label>
			<label>
				<input class="textforbutton" type="checkbox" required /> Я принимаю
				правила
			</label>
			<button>Отправить</button>
		</form>
	</body>
</html>
