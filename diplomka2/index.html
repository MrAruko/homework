<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />
		<title>Dyson</title>
		<link
			rel="shortcut icon"
			href="./icons/dyson-favicon32x32.png"
			type="image/x-icon"
		/>
		<script src="./js/index.js" type="module"></script>
	</head>
	<body class="page__body">
		<header class="header header--fixed">
			<div class="container header__container">
				<div class="header__actions">
					<button
						class="header__actions-button header__burger burger"
						aria-label="Открыть меню"
						aria-expanded="false"
						aria-controls="header__menu"
					>
						<svg width="50" height="50">
							<use
								class="burger__icon-menu"
								href="./icons/sprite.svg#menu-burger"
							></use>
							<use
								class="burger__icon-cross"
								href="./icons/sprite.svg#menu-cross"
							></use>
						</svg>
					</button>
				</div>
				<a href="#" class="logo header__logo">
					<img
						class="logo__img"
						src="./icons/logo-icon.svg"
						width="183"
						height="77"
						alt="Логотип Dyson"
					/>
				</a>
				<nav
					class="menu header__menu"
					id="header__menu"
					aria-label="Главное меню"
				>
					<ul class="menu__list">
						<li class="menu__item">
							<a href="#about-us" class="menu__link">О нас</a>
						</li>
						<li class="menu__item">
							<a href="#delivery-and-payment" class="menu__link"
								>Доставка и оплата</a
							>
						</li>
						<li class="menu__item">
							<a href="#product-registration" class="menu__link"
								>Регистрация продукта</a
							>
						</li>
						<li class="menu__item">
							<a href="#service" class="menu__link">Сервис</a>
						</li>
						<li class="menu__item">
							<a href="#certificates-and-licenses" class="menu__link"
								>Сертификаты и лицензии</a
							>
						</li>
					</ul>
				</nav>
				<div class="header__actions">
					<button class="header__actions-button">
						<svg width="36" height="36">
							<use
								class="header__actions-icon"
								href="./icons/sprite.svg#basket"
							></use>
						</svg>
					</button>
				</div>
			</div>
		</header>
		<main class="main">
			<section class="hero">
				<div class="container hero__container">
					<div class="hero__info">
						<h1 class="hero__title">
							Уникальные технологии для ухода за волосами
						</h1>
						<p class="hero__text">
							Идеальная укладка для всех типов волос вместе с Dyson
						</p>
						<button class="hero__button" aria-label="Подробнее">
							Подробнее
						</button>
					</div>
					<img
						width="997"
						height="850"
						class="hero__img"
						src="./images/hero__woomen.png"
						alt="Девушка с феном."
					/>
				</div>
			</section>
		</main>
	</body>
</html>
